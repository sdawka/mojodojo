[workspace]
authors = ["Sahil Dawka <me@sahil.pro>"]
channels = ['https://conda.modular.com/max-nightly', 'conda-forge']
name = "maxop"
platforms = ['osx-arm64']
version = "0.1.0"

[tasks]
maxop-test = "python tests/test_maxop.py"
maxop-demo = "python demo.py"

[dependencies]
python = "3.12.*"
# Pinned to the exact nightly used by ../../mojo-max and ../ (mojo 1.3.0.dev2026110805).
max-all = "==26.8.0.dev2026110805"
numpy = "*"

[activation.env]
MODULAR_METAL_INTREE_METALLIB = "1"
MODULAR_TELEMETRY_ENABLED = "0"
